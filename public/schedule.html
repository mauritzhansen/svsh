<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#4a6741">
    <title>Schedule — SVSH</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B4%3C/text%3E%3C/svg%3E">
</head>
<body>
    <header id="topbar">
        <div class="topbar-title">🐴 <span id="biz-name">Schedule</span></div>
    </header>
    <main id="view" class="pub-view">
        <div class="day-header">
            <button class="secondary daynav" id="prev">‹</button>
            <button class="secondary" id="today-btn">Today</button>
            <button class="secondary daynav" id="next">›</button>
            <button class="secondary" id="mode-btn">Week</button>
        </div>
        <div id="out" class="muted">Loading…</div>
    </main>
    <script src="/schedule.js"></script>
</body>
</html>
